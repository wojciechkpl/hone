# Full hone configuration — all fields populated
default_model = "anthropic:claude-opus-4-5"

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
model = "claude-opus-4-5"

[providers.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
model = "gpt-4o"

[sandbox]
mode = "Supervised"
allowed_commands = ["ls", "cat", "grep", "cargo", "git"]
allowed_network_domains = ["api.anthropic.com", "api.openai.com"]
protected_paths = ["/etc", "/usr", "~/.ssh"]

[[routing]]
task = "file_read"
model = "anthropic:claude-haiku-3-5"

[[routing]]
task = "multi_file_edit"
model = "anthropic:claude-opus-4-5"

[budget]
daily_limit_usd = 10.0
session_limit_usd = 2.0

[server]
host = "127.0.0.1"
port = 3117
auth_token = "super-secret-token"
