[workspace]
members = [
    "crates/hone-cache",
    "crates/hone-proto",
    "crates/hone-config",
    "crates/hone-sandbox",
    "crates/hone-providers",
    "crates/hone-tools",
    "crates/hone-mcp",
    "crates/hone-index",
    "crates/hone-memory",
    "crates/hone-core",
    "crates/hone-recipes",
    "crates/hone-server",
    "crates/hone-tui",
    "bins/hone",
    "bins/honed",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wojciechkpl/hone"
homepage = "https://wojciechkpl.github.io/hone/"
keywords = ["ai", "coding-agent", "terminal", "llm", "tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates (path for local dev, version for crates.io publish)
hone-cache = { version = "0.1.0", path = "crates/hone-cache" }
hone-proto = { version = "0.1.0", path = "crates/hone-proto" }
hone-config = { version = "0.1.0", path = "crates/hone-config" }
hone-sandbox = { version = "0.1.0", path = "crates/hone-sandbox" }
hone-providers = { version = "0.1.0", path = "crates/hone-providers" }
hone-tools = { version = "0.1.0", path = "crates/hone-tools" }
hone-mcp = { version = "0.1.0", path = "crates/hone-mcp" }
hone-index = { version = "0.1.0", path = "crates/hone-index" }
hone-memory = { version = "0.1.0", path = "crates/hone-memory" }
hone-core = { version = "0.1.0", path = "crates/hone-core" }
hone-recipes = { version = "0.1.0", path = "crates/hone-recipes" }
hone-server = { version = "0.1.0", path = "crates/hone-server" }
hone-tui = { version = "0.1.0", path = "crates/hone-tui" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

# Error handling
thiserror = "2"
anyhow = "1"

# IDs and time
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
axum = "0.8"
hyper = { version = "1", features = ["http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Parsing
pulldown-cmark = "0.12"
toml = "0.8"
serde_yaml = "0.9"

# Git
git2 = "0.19"

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Hashing
blake3 = "1"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"

# Security
rustix = "0.38"
cfg-if = "1"
# Linux Landlock LSM sandbox (kernel 5.13+)
landlock = "0.4"

# Search and filesystem
notify = "7"
walkdir = "2"
ignore = "0.4"
regex = "1"

# Token and cost
tiktoken-rs = "0.6"

# AST parsing
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
streaming-iterator = "0.1"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }

# Encoding
base64 = "0.22"

# Testing
mockall = "0.13"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[profile.test]
opt-level = 1
