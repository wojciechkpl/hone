crossterm = { workspace = true, features = ["event-stream"] }
ratatui = { workspace = true }
arboard = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
clap = { version = "4", features = ["derive"] }
walkdir = { workspace = true }
sqlx = { workspace = true }
