[package]
name = "hone-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hone CLI — the universal terminal AI coding agent"

[[bin]]
name = "hone"
path = "src/main.rs"

[dependencies]
hone-core = { workspace = true }
hone-tui = { workspace = true }
hone-config = { workspace = true }
hone-recipes = { workspace = true }
hone-providers = { workspace = true }
hone-proto = { workspace = true }
hone-sandbox = { workspace = true }
hone-tools = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
ratatui = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
