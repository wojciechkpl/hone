# Starter suite for `hone eval` (docs/plans/eval-starter-suite-spec.md).
# working_dir, memory_fixture and the check script are relative to this file.
# The runner sets EVAL_SUITE_DIR (absolute path of this directory) when it runs a check;
# the check runs with the run's working-directory copy as its current directory.

[[tasks]]
id = "c01-py-fix-median"
prompt = "The median() function in stats.py gives the wrong answer for some inputs. Fix the bug so that `python3 -m unittest` passes. Do not change the tests."
success_check = "sh \"$EVAL_SUITE_DIR/checks/c01-py-fix-median.sh\""
working_dir = "c01-py-fix-median"
timeout_secs = 300

[[tasks]]
id = "c02-py-add-slugify"
prompt = "Add a function slugify(text) to text_utils.py so that the tests in test_text_utils.py pass (`python3 -m unittest`). It should turn a title into a lowercase, hyphen-separated URL slug. Do not change the tests."
success_check = "sh \"$EVAL_SUITE_DIR/checks/c02-py-add-slugify.sh\""
working_dir = "c02-py-add-slugify"
timeout_secs = 300

