name: Nightly Real-API Tests

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 3 AM UTC
  workflow_dispatch:

jobs:
  real-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Run real-api tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: cargo test -p hone-providers --test real_api -- --ignored --nocapture

      - name: Install Claude Code (for ACP testing)
        run: |
          # Skip for now — Claude Code installation requires interactive authentication.
          # When an automated install flow is available, add it here.
          echo "ACP binary install not yet automated"

      - name: Run ACP integration tests
        if: false  # Disabled until ACP binary install is automated in CI
        env:
          HONE_ACP_BIN: claude
        run: cargo test -p hone-providers --test acp_real -- --ignored --nocapture
