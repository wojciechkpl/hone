<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Hone guardrails, checked in order</title>
  <desc id="desc">A tool call passes three layers. First, permission rules from permissions.toml, which are off until you write rules. Second, the shell tool's built-in command checks, which are always on. Third, the OS sandbox around shell commands: Seatbelt on macOS is on by default, Landlock on Linux is opt-in with HONE_SANDBOX_ENFORCE=1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #8b949e; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #f0b3bd; }
    .n { font-size: 22px; font-weight: 800; fill: #0d1117; }
    .pill { font-size: 11.5px; font-weight: 700; }
    .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  </style>

  <rect x="0" y="0" width="960" height="430" rx="14" fill="url(#bg)"/>
  <polygon points="28,30 58,38 28,46" fill="#e8445a"/>
  <text x="68" y="44" class="t" style="font-size:18px">Guardrails, checked in order</text>
  <text x="932" y="44" class="s" text-anchor="end">what runs before a tool call touches your machine</text>

  <!-- Incoming call -->
  <rect x="28" y="70" width="150" height="40" rx="20" fill="#21262d" stroke="#30363d"/>
  <text x="103" y="95" class="m" text-anchor="middle">tool call</text>
  <path d="M103,110 L103,126" class="line" marker-end="url(#arrow)"/>

  <!-- Layer 1 -->
  <rect x="28" y="130" width="904" height="80" rx="12" fill="#1c2128" stroke="#e8445a" stroke-width="1.4"/>
  <circle cx="64" cy="170" r="20" fill="#e8445a"/>
  <text x="64" y="178" class="n" text-anchor="middle">1</text>
  <text x="100" y="160" class="t">Permission rules</text>
  <text x="100" y="180" class="s">permissions.toml (user, then project). Matches file paths, git and shell commands, web_fetch hosts.</text>
  <text x="100" y="198" class="m">allow · ask · deny · project rules can only tighten · headless asks fail closed</text>
  <rect x="742" y="150" width="174" height="26" rx="13" fill="#3b2f12" stroke="#d29922"/>
  <text x="829" y="168" class="pill" text-anchor="middle" fill="#e3b341">off until you add rules</text>

  <path d="M103,210 L103,226" class="line" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="28" y="230" width="904" height="80" rx="12" fill="#1c2128" stroke="#a5404f" stroke-width="1.4"/>
  <circle cx="64" cy="270" r="20" fill="#c43a50"/>
  <text x="64" y="278" class="n" text-anchor="middle">2</text>
  <text x="100" y="260" class="t">Shell command checks</text>
  <text x="100" y="280" class="s">Built into the shell tool. Blocks sudo, su, doas, pkexec. Refuses destructive and network commands,</text>
  <text x="100" y="298" class="s">and anything chained with ; &amp;&amp; || $( ) or backticks; | is allowed only into read-only filters (head, grep, wc...).</text>
  <rect x="742" y="250" width="174" height="26" rx="13" fill="#12301c" stroke="#2ea043"/>
  <text x="829" y="268" class="pill" text-anchor="middle" fill="#56d364">always on</text>

  <path d="M103,310 L103,326" class="line" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="28" y="330" width="904" height="80" rx="12" fill="#1c2128" stroke="#7a3040" stroke-width="1.4"/>
  <circle cx="64" cy="370" r="20" fill="#9c2f43"/>
  <text x="64" y="378" class="n" text-anchor="middle">3</text>
  <text x="100" y="360" class="t">OS sandbox around shell commands</text>
  <text x="100" y="380" class="s">Reads: system dirs, toolchain caches, working dir. Writes: working dir and /tmp. Seatbelt also denies network.</text>
  <text x="100" y="398" class="m">Linux Landlock: filesystem rules only, needs HONE_SANDBOX_ENFORCE=1 · other OSes: none</text>
  <rect x="742" y="342" width="174" height="26" rx="13" fill="#12301c" stroke="#2ea043"/>
  <text x="829" y="360" class="pill" text-anchor="middle" fill="#56d364">macOS: on</text>
  <rect x="742" y="374" width="174" height="26" rx="13" fill="#3b2f12" stroke="#d29922"/>
  <text x="829" y="392" class="pill" text-anchor="middle" fill="#e3b341">Linux: opt-in</text>
</svg>
