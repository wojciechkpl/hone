[[task]]
id = "refactor-duplication"
setup = '''
cat > handlers.py << "PYEOF"
def handle_get(request):
    if not request.get("auth_token"):
        return {"error": "unauthorized", "code": 401}
    if not request.get("user_id"):
        return {"error": "missing user_id", "code": 400}
    return {"data": "get_result", "code": 200}

def handle_post(request):
    if not request.get("auth_token"):
        return {"error": "unauthorized", "code": 401}
    if not request.get("user_id"):
        return {"error": "missing user_id", "code": 400}
    return {"data": "post_result", "code": 200}

def handle_delete(request):
    if not request.get("auth_token"):
        return {"error": "unauthorized", "code": 401}
    if not request.get("user_id"):
        return {"error": "missing user_id", "code": 400}
    return {"data": "delete_result", "code": 200}
PYEOF
'''
prompt = "Refactor handlers.py to extract the duplicated auth_token and user_id validation into a shared helper function"
check = '''test "$(grep -c auth_token handlers.py)" -le 2 && python3 -c "
from handlers import handle_get, handle_post, handle_delete
for h in (handle_get, handle_post, handle_delete):
    assert h({})['code'] == 401
    assert h({'auth_token': 'x'})['code'] == 400
    assert h({'auth_token': 'x', 'user_id': '1'})['code'] == 200
"'''
