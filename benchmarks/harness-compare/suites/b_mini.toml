# Suite B: Hone's 10-task mini-bench (ported from benchmarks/mini_bench.sh).
# Graded by each task's own `check` command (exit 0 = pass), NOT by the
# SWE-bench grader. Smoke-level evidence only: never merged into the headline.
#
# The runner creates /work/repo, runs `setup` there, then commits the result
# (`init_repo = true` is the default for this suite).

[[task]]
id = "fix-typo"
setup = '''
cat > main.py << "PYEOF"
def calcualte_average(numbers):
    """Calcualte the average of a list of numbers."""
    if len(numbers) == 0:
        return 0
    return sum(numbers) / len(numbers)

def main():
    result = calcualte_average([1, 2, 3, 4, 5])
    print(f"Average: {result}")

if __name__ == "__main__":
    main()
PYEOF
'''
prompt = "Fix the typo in the function name in main.py — it should be calculate_average not calcualte_average"
check = 'grep -q "def calculate_average" main.py && python3 main.py'

