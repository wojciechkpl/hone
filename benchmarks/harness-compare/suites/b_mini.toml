[[task]]
id = "add-docstring"
setup = '''
cat > utils.py << "PYEOF"
def flatten(nested_list):
    result = []
    for item in nested_list:
        if isinstance(item, list):
            result.extend(flatten(item))
        else:
            result.append(item)
    return result
PYEOF
'''
prompt = "Add a docstring to the flatten function in utils.py explaining what it does"
check = 'python3 -c "from utils import flatten; assert flatten.__doc__ is not None and len(flatten.__doc__) > 10; assert flatten([1,[2,[3]]])==[1,2,3]"'

