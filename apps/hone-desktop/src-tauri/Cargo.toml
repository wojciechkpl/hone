[package]
name = "hone-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hone Desktop — Tauri 2 shell wrapping honed"

[[bin]]
name = "hone-desktop"
path = "src/main.rs"

[lib]
name = "hone_desktop_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
uuid = { workspace = true }
futures = { workspace = true }
dirs = "5"
parking_lot = "0.12"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# When enabled, the supervisor uses a stub child rather than spawning a
# real `honed`. Used in tests so we don't need the daemon binary on PATH.
test-stub = []

[lints]
workspace = true
