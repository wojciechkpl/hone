name: Desktop Release

# Cross-platform Tauri 2 build matrix for the Hone desktop app.
#
# Triggers on tag pushes of the form `desktop-v<semver>` (e.g.
# `desktop-v0.1.3`). The matching tag scheme is intentionally distinct
# from the CLI release tags (`v*` consumed by `release.yml`) so the two
# can ship on independent cadences.
#
# Signing slots: `signingIdentity` / `tauriSecret*` env vars are read
# unconditionally; when absent (e.g. on PR validation runs from forks)
# Tauri produces unsigned bundles. Real releases must populate the
# secrets in the repo settings — see `apps/hone-desktop/RELEASE.md`.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to associate the build with"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-arm64
            runs_on: macos-14
            target: aarch64-apple-darwin
          - name: macOS-x86_64
            runs_on: macos-13
            target: x86_64-apple-darwin
          - name: Linux-x86_64
            runs_on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows-x86_64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry + build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/hone-desktop/src-tauri -> target

      # Linux needs the WebKit GTK + tray dependencies that Tauri's
      # webview pulls in; macOS and Windows ship them.
      - name: Install Linux dependencies
        if: matrix.platform.runs_on == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # Use the official tauri-action wrapper. It runs `cargo tauri
      # build` for us and uploads the resulting bundles to the GitHub
      # release identified by the tag (or creates one if missing).
      #
      # Code signing env vars are passed through. When unset, Tauri
      # builds unsigned artefacts — fine for nightly/PR validation but
      # NOT acceptable for a production release.
      - name: Build + bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri auto-updater signing keys (required for the updater
          # plugin to verify signatures; both must be set or omitted).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/hone-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Hone Desktop ${{ github.ref_name }}"
          releaseBody: |
            See `CHANGELOG.md` for highlights.

            **Note:** these bundles may be unsigned if the release was
            cut without the signing secrets configured. Verify the
            checksum against the GitHub release page before installing.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      # Belt-and-braces upload: the same bundles as workflow artefacts,
      # so a `workflow_dispatch` run that does NOT push to a release
      # still leaves something downloadable.
      - name: Upload bundle artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hone-desktop-${{ matrix.platform.name }}
          path: |
            apps/hone-desktop/src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn
