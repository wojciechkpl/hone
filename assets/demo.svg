<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-label="Hone demo: step-by-step fix of a ZeroDivisionError">
  <title>Hone — fix ZeroDivisionError (animated)</title>
  <desc>Step-by-step animation of a Hone session: the user describes a failing test, Hone calls read_file and edit_file, runs cargo test, and reports the fix. 12-second loop.</desc>

  <!-- Window chrome -->
  <rect width="1240" height="500" rx="10" ry="10" fill="#282d35"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f58"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#18c132"/>
  <text x="600" y="26" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7a818d">hone — terminal</text>

  <!-- Body. Each <g class="step"> below begins invisible (opacity=0) and
       fades to opacity=1 at its scheduled offset within the 12s loop.
       Every animation uses values="0;0;1;1" with keyTimes that put the
       fade in a tiny window so the transition is perceptible but fast. -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#b9c0cb">

    <!-- Step 1 — user prompt (begins at 0.5s of 12s = 4.17%) -->
    <g opacity="0">
      <text x="20" y="78">
        <tspan fill="#66c2cd" font-weight="700">$ </tspan><tspan fill="#a8cc8c" font-weight="700">hone</tspan><tspan> "the test_divide test fails because divide(10, 0) raises ZeroDivisionError. fix it to return None."</tspan>
      </text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.041;0.058;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 2 — read_file label (begins at 2.0s = 16.7%) -->
    <g opacity="0">
      <text x="20" y="118">
        <tspan fill="#cfa3d6">[tool]</tspan><tspan> read_file  calculator.py</tspan>
      </text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.166;0.183;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 3 — file content box (2.5s = 20.8%) -->
    <g opacity="0">
      <rect x="60" y="128" width="700" height="60" rx="4" fill="#1f242c" stroke="#3c424d" stroke-width="1"/>
      <text x="74" y="148"><tspan fill="#7a818d">  1</tspan><tspan>  def divide(a, b):</tspan></text>
      <text x="74" y="166"><tspan fill="#7a818d">  2</tspan><tspan>      return a / b</tspan></text>
      <text x="74" y="184"><tspan fill="#7a818d">  3</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.208;0.225;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 4 — edit_file label (4.0s = 33.3%) -->
    <g opacity="0">
      <text x="20" y="220">
        <tspan fill="#cfa3d6">[tool]</tspan><tspan> edit_file  calculator.py</tspan>
      </text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333;0.350;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 5 — diff box (4.5s = 37.5%) -->
    <g opacity="0">
      <rect x="60" y="230" width="700" height="92" rx="4" fill="#1f242c" stroke="#3c424d" stroke-width="1"/>
      <text x="74" y="250" fill="#df8d8d">-     return a / b</text>
      <text x="74" y="268" fill="#a8cc8c">+     if b == 0:</text>
      <text x="74" y="286" fill="#a8cc8c">+         return None</text>
      <text x="74" y="304" fill="#a8cc8c">+     return a / b</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.375;0.392;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 6 — cargo test label (6.5s = 54.2%) -->
    <g opacity="0">
      <text x="20" y="350">
        <tspan fill="#cfa3d6">[shell]</tspan><tspan> </tspan><tspan fill="#66c2cd" font-weight="700">!cargo test</tspan>
      </text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.541;0.558;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 7 — test output (7.0s = 58.3%) -->
    <g opacity="0">
      <text x="60" y="370">  running 12 tests</text>
      <text x="60" y="386">
        <tspan>  test test_divide_by_zero ... </tspan><tspan fill="#a8cc8c" font-weight="700">ok</tspan>
      </text>
      <text x="60" y="402" fill="#a8cc8c">  12 passed in 0.3s</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.583;0.6;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 8 — closing summary (9.0s = 75%) -->
    <g opacity="0">
      <text x="20" y="438" fill="#e5c07b">Fixed. divide() now returns None on zero division.</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.766;1" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Step 9 — footer + status (9.5s = 79.2%) -->
    <g opacity="0">
      <line x1="20" y1="458" x2="1220" y2="458" stroke="#3c424d" stroke-width="1"/>
      <text x="20" y="478" fill="#7a818d" font-size="12">claude-sonnet  |  $0.001  |  ctx 18%  |  5s</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.791;0.808;1" dur="12s" repeatCount="indefinite" />
    </g>
  </g>
</svg>
